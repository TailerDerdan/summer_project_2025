<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editor map</title>
    <link rel="stylesheet" href="./styleMapEditor.css">
</head>
<body>
    <section class="app-editor">
        <section class="menu">
            <div class="buldings">
                <p>Сооружения:</p>
                <div class="bulding floor">
                    <img src="./../sprites/level1/floorSprites.png" class="bulding_img" alt="пол">
                </div>
                <div class="bulding wall">
                    <img src="./../sprites/level1/wallSprites.png" class="bulding_img" alt="стена">
                </div>
                <div class="bulding car">
                    <img src="./../sprites/level1/car.png" class="bulding_img" alt="машина">
                </div>
            </div>
            <div class="button-saving">
                <button>Сохранить</button>
            </div>
            <div class="choosen-sprites">
                <canvas id="sprites"></canvas>
            </div>
        </section>
        <section class="map">
            <canvas id="editor"></canvas>
        </section>
    </section>
    <script type="module" src="./redactor.js"></script>
</body>
</html>
