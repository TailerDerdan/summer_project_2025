security:
    password_hashers:
        # App\Entity\User\User: 'auto'
        App\Security\SecurityUser: 'auto'

    providers:
        # app_user_provider:
        #     entity:
        #         class: App\Entity\User\User
        #         property: nickName
        security_user_provider:
            id: App\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: security_user_provider
            custom_authenticator: App\Security\UserAuthenticator
            # form_login:
            #     login_path: login
            #     check_path: login
            logout:
                path: /auth/logout
                target: /auth/login

    access_control:
        - { path: ^/auth/registry, roles: PUBLIC_ACCESS }
        - { path: ^/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }