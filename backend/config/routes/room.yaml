room_create_page:
    path: /room/create
    methods: GET
    controller: App\Controller\RoomController::createPage

room_create:
    path: /room/create
    methods: POST
    controller: App\Controller\RoomController::create

show_room:
    path: /room/show/{id}
    methods: GET
    controller: App\Controller\RoomController::showRoom

room_join:
    path: /room/join
    methods: GET
    controller: App\Controller\RoomController::join
